name: Clinic platform checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: clinic-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: git ls-files --cached --others --exclude-standard | node scripts/scan-secrets.mjs
      - run: npm run lint
      - run: npm run verify:appointments
      - run: npm run verify:platform
      - run: npm run verify:prescriptions
      - run: npm run verify:visits
      - run: npm run verify:timeline
      - run: npm run verify:follow-ups
      - run: npm run verify:onboarding
      - run: npm run verify:staff-roles
      - run: npm run verify:reports
      - run: npm run verify:audit
      - run: npm run verify:documents
      - run: npm run verify:notifications
      - run: npm run verify:billing
      - run: npm run verify:platform-admin
      - run: npm run verify:operations
      - run: npm run verify:auth
      - run: npm run verify:recovery
      - run: npm run verify:performance
      - run: npm run verify:security
      - run: npm run verify:workspace
      - run: npm run verify:clinical-review
      - run: npm run build
